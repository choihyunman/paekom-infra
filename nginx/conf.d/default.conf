resolver 127.0.0.11 valid=30s;  # Docker 내부 DNS

# === Upstream 설정 ===
upstream frontend {
    zone upstream_frontend 64k;
    server frontend:5173 resolve;
}

upstream backend {
    zone upstream_backend 64k;
    server backend:8080 resolve;
}

upstream ai {
    zone upstream_ai 64k;
    server ai:8000 resolve;
}

# === HTTP → HTTPS 리다이렉트 ===
server {
    listen 80;
    server_name paekom.com www.paekom.com;
    return 301 https://$server_name$request_uri;
}

# === 메인 HTTPS 서버 설정 ===
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paekom.com www.paekom.com;

    # === SSL 인증서 설정 ===
    ssl_certificate /etc/letsencrypt/live/paekom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paekom.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === 공통 프록시 헤더 ===
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # === WebSocket 프록시 설정 ===
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # WebSocket handshake 필수 헤더 전달
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # === Frontend (React Vite) ===
    location / {
        proxy_pass http://frontend/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        error_page 502 503 504 = @maintenance;
    }

    # === Backend REST API ===
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_intercept_errors on;
        error_page 503 = @maintenance;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # === Maintenance 페이지 ===
    location @maintenance {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
    }
}